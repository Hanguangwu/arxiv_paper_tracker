name: Weekly Paper Analysis

on:
  schedule:
    - cron: '0 0 * * 0'  # Run every Sunday at 00:00 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analyze-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: true
        fetch-depth: 0  # 完整历史，rebase 时不会被浅克隆限制

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run paper analysis
      env:
        # Matches the variable names read by src/main.py via os.getenv or the
        # OpenAI client. LLM_API_KEY also falls back to the legacy
        # DEEPSEEK_API_KEY secret name.
        LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DEEPSEEK_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
      working-directory: src
      run: python main.py

    - name: Build static site for GitHub Pages
      run: python src/web/export_static.py
      env:
        # Repo-name base path so links work under https://<user>.github.io/<repo>/
        BASE_PATH: /${{ github.event.repository.name }}/

    - name: Compute report date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Commit and push changes
      # Why not stefanzweifel/git-auto-commit-action: it has no pull/rebase
      # retry, so any concurrent advance of main (double trigger / force push)
      # makes its push fail with "non-fast-forward". replace the whole step.
      # --strategy-option=theirs: during `git rebase FETCH_HEAD`, "theirs" is
      # the replayed run-local commit, so this run's generated data wins.
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit. Skip push."
          exit 0
        fi
        git commit -m "chore: update paper analysis for ${{ steps.date.outputs.date }}"

        for _ in 1 2 3; do
          if git push origin main; then
            echo "Push succeeded."
            exit 0
          fi
          echo "Push rejected (expected if main moved concurrently). Rebasing onto origin/main ..."
          git fetch origin main
          if git rebase --strategy-option=theirs FETCH_HEAD; then
            echo "Rebase ok, retrying push ..."
          else
            echo "Rebase hit conflicts; aborting to keep repo clean."
            git rebase --abort
            exit 1
          fi
        done
        echo "Push failed after 3 attempts."
        exit 1

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: docs

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4