name: Weekly Paper Analysis

on:
  schedule:
    - cron: '0 0 * * 0'  # Run every Sunday at 00:00 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analyze-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run paper analysis
      env:
        # Matches the variable names read by src/main.py via os.getenv or the
        # OpenAI client. LLM_API_KEY also falls back to the legacy
        # DEEPSEEK_API_KEY secret name.
        LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DEEPSEEK_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
      working-directory: src
      run: python main.py

    - name: Build static site for GitHub Pages
      run: python src/web/export_static.py
      env:
        # Repo-name base path so links work under https://<user>.github.io/<repo>/
        BASE_PATH: /${{ github.event.repository.name }}/

    - name: Compute report date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "chore: update paper analysis for ${{ steps.date.outputs.date }}"
        commit_user_name: github-actions[bot]
        commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: docs

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4